<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>grokbot-local</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <aside class="sidebar">
      <header class="brand">
        <strong>grokbot-local</strong>
        <span id="health" class="pill off">API</span>
      </header>
      <button id="new-thread" type="button">New thread</button>
      <nav id="threads" class="thread-list"></nav>
      <section class="routines">
        <h2>Routines</h2>
        <ul id="routines"></ul>
        <form id="routine-form">
          <input name="name" placeholder="Name" required />
          <input name="schedule" placeholder="Cron (0 8 * * 1-5)" />
          <input name="prompt" placeholder="Prompt" required />
          <button type="submit">Add</button>
        </form>
      </section>
    </aside>
    <main class="main">
      <header class="toolbar">
        <label>
          Persona
          <select id="persona"></select>
        </label>
        <p id="persona-desc" class="muted"></p>
      </header>
      <section id="messages" class="messages"></section>
      <form id="composer" class="composer">
        <textarea id="input" rows="2" placeholder="Message…" required></textarea>
        <button type="submit">Send</button>
      </form>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
