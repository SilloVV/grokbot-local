# Ollama runs on the HOST, not in Compose.
# Point the API at it via host.docker.internal (see INFERENCE_BASE_URL).
#
# The desktop app is a Tauri native shell — do not containerize it.
#
# Sandbox containers are spawned on demand by the orchestrator
# (SANDBOX_MODE=local). They are not long-running Compose services.
# Build the optional base image:
#   docker build -t vrac-sandbox:local packages/sandbox/image
# then set SANDBOX_IMAGE=vrac-sandbox:local
#
# The orchestrator container needs access to the host Docker socket
# to spawn sandbox containers. That is the only host surface; user
# commands still run inside --network none --cap-drop ALL containers.

services:
  orchestrator:
    build:
      context: .
      dockerfile: apps/orchestrator/Dockerfile
    ports:
      - "8787:8787"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file: .env
    environment:
      INFERENCE_BASE_URL: http://host.docker.internal:11434/v1
      ORCHESTRATOR_HOST: 0.0.0.0
      ORCHESTRATOR_PORT: "8787"
      SANDBOX_MODE: local
      SANDBOX_DOCKER_BIN: docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
